trigger:
- main

pool:
  name: Default

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME: frontend

steps:

- checkout: self

# 🔹 Login to ACR
- script: |
    docker login $(ACR_NAME).azurecr.io -u $(ACR_NAME) -p $(ACR_PASSWORD)
  displayName: Login to ACR

# 🔹 Build & Push
- script: |
    docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest ./frontend
    docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest
  displayName: Build and Push Image

# 🔹 Deploy
- script: |
    kubectl get nodes
    kubectl apply -f ks8/
  displayName: Deploy to AKS
