trigger:
- main

pool:
  name: Default   # self-hosted agent

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME_FRONTEND: frontend
  IMAGE_NAME_BACKEND: backend
  TAG: $(Build.BuildId)

stages:

# 🔹 STAGE 1: BUILD & PUSH
- stage: BuildAndPush
  displayName: Build and Push Images

  jobs:
  - job: DockerJob
    steps:

    - checkout: self

    # Login to ACR
    - script: |
        echo $(ACR_PASSWORD) | docker login $(ACR_NAME).azurecr.io -u $(ACR_NAME) --password-stdin
      displayName: Login to ACR

    # Build & Push Frontend
    - script: |
        docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG) ./frontend
        docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG)
      displayName: Build & Push Frontend

    # Build & Push Backend
    - script: |
        docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG) ./backend
        docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG)
      displayName: Build & Push Backend


# 🔹 STAGE 2: DEPLOY
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: BuildAndPush

  jobs:
  - job: DeployJob
    steps:

    - checkout: self

    # Check cluster
    - script: |
        kubectl get nodes
      displayName: Check AKS Connection

    # 🔥 IMPORTANT: Update images with version tag
    - script: |
        kubectl set image deployment/ecommerce-frontend \
        frontend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG)

        kubectl set image deployment/ecommerce-backend \
        backend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG)
      displayName: Update Images with Version Tag

    # Apply manifests (if needed)
    - script: |
        kubectl apply -f ks8/
      displayName: Apply Kubernetes YAML

    # 🔥 NEW: Rollout status check
    - script: |
        kubectl rollout status deployment/ecommerce-frontend
        kubectl rollout status deployment/ecommerce-backend
      displayName: Verify Deployment Rollout

    # 🔥 NEW: Debug visibility
    - script: |
        echo "Pods status:"
        kubectl get pods -o wide

        echo "Services:"
        kubectl get svc

        echo "Deployments:"
        kubectl get deploy
      displayName: Debug Cluster State
