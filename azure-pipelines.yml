trigger:
- main

pool:
  name: Default   # your self-hosted agent

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME_FRONTEND: frontend
  IMAGE_NAME_BACKEND: backend
  TAG: $(Build.BuildId)

stages:

# 🔹 STAGE 1: BUILD & PUSH
- stage: BuildAndPush
  displayName: Build and Push Images

  jobs:
  - job: DockerJob
    steps:

    # Checkout
    - checkout: self

    # Login to ACR
    - script: |
        echo $(ACR_PASSWORD) | docker login $(ACR_NAME).azurecr.io -u $(ACR_NAME) --password-stdin
      displayName: Login to ACR

    # Build & Push Frontend
    - script: |
        docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG) ./frontend
        docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG)
      displayName: Build & Push Frontend

    # Build & Push Backend
    - script: |
        docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG) ./backend
        docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG)
      displayName: Build & Push Backend


# 🔹 STAGE 2: DEPLOY
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: BuildAndPush

  jobs:
  - job: DeployJob
    steps:

    - checkout: self

    # Verify cluster
    - script: |
        kubectl get nodes
      displayName: Check AKS Connection

    # Update images dynamically (VERY IMPORTANT)
    - script: |
        kubectl set image deployment/ecommerce-frontend \
        frontend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG)

        kubectl set image deployment/ecommerce-backend \
        backend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG)
      displayName: Update Images

    # Apply manifests (only if needed)
    - script: |
        kubectl apply -f ks8/
      displayName: Apply Kubernetes YAML
