trigger:
- main

pool:
  name: Default

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME: frontend

steps:

- checkout: self

- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: ps
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name $(ACR_NAME)

- script: |
    docker buildx create --use
    docker buildx build --platform linux/arm64 -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) --push ./frontend
  displayName: Build & Push Image

- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: ps
    scriptLocation: inlineScript
    inlineScript: |
      az aks get-credentials --name ecommerce-aks --resource-group ecommerseapp --overwrite-existing

- script: |
    helm upgrade --install ecommerce ./helm/ecommerce --set image.tag=$(Build.BuildId)
  displayName: Deploy to AKS