trigger:
- main

pool:
  name: Default

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME_FRONTEND: ecommerce-frontend
  IMAGE_NAME_BACKEND: ecommerce-backend
  TAG: $(Build.BuildId)

stages:

# ================= BUILD & PUSH =================
- stage: BuildAndPush
  displayName: Build and Push Images
  jobs:
  - job: DockerJob
    steps:
    - checkout: self

    # 🔐 Login to ACR
    - script: |
        echo $(ACR_PASSWORD) | docker login $(ACR_NAME).azurecr.io -u $(ACR_NAME) --password-stdin
      displayName: Login to ACR

    # 🔥 Enable buildx
    - script: |
        docker buildx create --use
      displayName: Enable Docker Buildx

    # 🔥 Build & Push FRONTEND (Multi-Arch)
    - script: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG) \
          ./frontend --push
      displayName: Build & Push Frontend (Multi-Arch)

    # 🔥 Build & Push BACKEND (Multi-Arch)
    - script: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG) \
          ./backend --push
      displayName: Build & Push Backend (Multi-Arch)


# ================= DEPLOY TO DEV =================
- stage: Deploy_Dev
  displayName: Deploy to DEV
  dependsOn: BuildAndPush

  jobs:
  - deployment: DevDeploy
    environment: dev   # 👉 Add approval here in Azure DevOps UI
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: kubectl get nodes
            displayName: Check AKS

          # Apply all K8s configs
          - script: kubectl apply -f ks8/
            displayName: Apply YAML

          # Update images
          - script: |
              kubectl set image deployment/ecommerce-frontend \
              frontend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG)

              kubectl set image deployment/ecommerce-backend \
              backend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG)
            displayName: Update Images

          # Verify rollout
          - script: kubectl rollout status deployment/ecommerce-frontend
            displayName: Verify Frontend

          - script: kubectl rollout status deployment/ecommerce-backend
            displayName: Verify Backend


# ================= DEPLOY TO PROD =================
- stage: Deploy_Prod
  displayName: Deploy to PROD
  dependsOn: Deploy_Dev

  jobs:
  - deployment: ProdDeploy
    environment: production   # 👉 Add approval here
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: kubectl get nodes
            displayName: Check AKS

          - script: kubectl apply -f ks8/
            displayName: Apply YAML

          - script: |
              kubectl set image deployment/ecommerce-frontend \
              frontend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_FRONTEND):$(TAG)

              kubectl set image deployment/ecommerce-backend \
              backend=$(ACR_NAME).azurecr.io/$(IMAGE_NAME_BACKEND):$(TAG)
            displayName: Update Images

          - script: kubectl rollout status deployment/ecommerce-frontend
            displayName: Verify Frontend

          - script: kubectl rollout status deployment/ecommerce-backend
            displayName: Verify Backend
