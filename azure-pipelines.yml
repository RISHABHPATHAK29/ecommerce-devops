trigger:
- main
trigger:
- main

pool:
  name: Default

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME: frontend

steps:

- checkout: self

# Login to ACR
- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name $(ACR_NAME)

# Build & Push Image
- script: |
    docker buildx create --use || true
    docker buildx build \
      --platform linux/amd64 \
      -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) \
      -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest \
      --push ./frontend
  displayName: Build & Push Image

# Connect to AKS
- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az aks get-credentials \
        --name ecommerce-aks \
        --resource-group ecommerseapp \
        --overwrite-existing

# Deploy
- script: |
    kubectl apply -f ks8/
  displayName: Deploy to AKS
