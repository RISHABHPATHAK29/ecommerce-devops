trigger:
- main

pool:
  name: Default   # ✅ your self-hosted agent

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME: frontend
  RESOURCE_GROUP: ecommerceapp
  AKS_NAME: ecommerce-aks-private

steps:

# 🔹 Checkout code
- checkout: self

# 🔹 Login to Azure + ACR
- task: AzureCLI@2
  displayName: Login to ACR
  inputs:
    azureSubscription: 'azure-connection-new'   # ✅ NEW connection
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name $(ACR_NAME)

# 🔹 Build & Push Docker Image
- script: |
    docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) ./frontend
    docker tag $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest
    docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)
    docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest
  displayName: Build and Push Image

# 🔹 Get AKS credentials (ADMIN MODE - FIXED)
- task: AzureCLI@2
  displayName: Connect to AKS
  inputs:
    azureSubscription: 'azure-connection-new'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az aks get-credentials \
        --name $(AKS_NAME) \
        --resource-group $(RESOURCE_GROUP) \
        --admin \
        --overwrite-existing

# 🔹 Deploy to AKS
- script: |
    kubectl apply -f ks8/
  displayName: Deploy to AKS