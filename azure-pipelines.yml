trigger:
- main

pool:
  name: Default   # self-hosted agent

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME: frontend

steps:
- checkout: self

- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name $(ACR_NAME)

- script: |
    docker buildx create --use
    docker buildx build \
      --platform linux/arm64 \
      -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) \
      --push ./frontend
  displayName: Build & Push

- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az aks get-credentials \
        --name ecommerce-aks \
        --resource-group ecommerseapp \
        --overwrite-existing

- script: |
    helm upgrade --install ecommerce ./helm/ecommerce \
      --set image.tag=$(Build.BuildId)
  displayName: Deploy