trigger:
- main

pool:
  name: Default   # ✅ using your self-hosted agent

variables:
  ACR_NAME: rishabhacr07
  IMAGE_NAME: frontend

steps:

# 🔹 Checkout code
- checkout: self

# 🔹 Login to ACR
- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az acr login --name $(ACR_NAME)

# 🔹 Build & Push Docker Image
- script: |
    docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) ./frontend
    docker tag $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest
    docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)
    docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest
  displayName: Build and Push Image

# 🔹 Connect to AKS (FIXED with --admin)
- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az aks get-credentials \
        --name ecommerce-aks-private \
        --resource-group ecommerceapp \
        --admin \
        --overwrite-existing

# 🔹 Deploy to AKS
- script: |
    kubectl apply -f ks8/
  displayName: Deploy to AKS